name: peci_project
description: "Aplicação Interativa de Suporte à Aprendizagem - PECI UA 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # UI, Design e Gamificação (UA Style)
  flutter_riverpod: ^3.3.1
  google_fonts: ^8.0.2
  lottie: ^3.1.0
  
  # Navegação e Infraestrutura
  go_router: ^17.2.1
  dio: ^5.4.1
  
  # Markdown rendering
  flutter_markdown_plus: ^1.0.7

  # Persistência de preferências (popup de regras, etc.)
  shared_preferences: ^2.3.0

  # Persistência Local (Modo Offline)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de Código
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/chatbot_photo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/chatbot_photo.png